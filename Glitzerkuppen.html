<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glitzerkuppen</title>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#f2f2f2;
    }

    /* LOGIN */
    #loginPage{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#ffffff,#ff00ae);
    }

    .login-box{
      background:#ff00ae;
      padding:30px;
      border-radius:15px;
      width:320px;
      box-shadow:0 0 20px rgba(0,0,0,0.3);
    }

    .login-box h2{
      text-align:center;
    }

    .login-box input{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:8px;
      border:1px solid #ccc;
      box-sizing:border-box;
    }

    .login-box button{
      width:100%;
      padding:12px;
      margin-top:15px;
      border:none;
      border-radius:8px;
      background:#ffffff;
      color:#ff00ae;
      cursor:pointer;
      font-size:16px;
    }

    .error{
      color:red;
      text-align:center;
      margin-top:10px;
    }

    /* STARTSEITE */
    #mainPage{
      display:none;
      height:100vh;
    }

    .layout{
      display:flex;
      height:100%;
    }

    .sidebar{
      width:250px;
      background:#ff00ae;
      color:white;
      padding:20px;
    }

    .sidebar h1{
      margin-top:0;
    }

    .sidebar a{
      display:inline-block;
      margin-top:20px;
      color:#ff00ae;
      text-decoration:none;
      background:white;
      padding:10px 15px;
      border-radius:8px;
    }

    .content{
      flex:1;
      position:relative;
      overflow:hidden;
    }

    .content img{
  width:700px;
  height:auto;
  display:block;
  margin:40px auto;
  border-radius:15px;
}

    .map-button{
      position:absolute;
      padding:10px 15px;
      background:#ff00ae;
      color:white;
      border:none;
      border-radius:8px;
      cursor:pointer;
    }

  </style>
</head>
<body>

  </div>

</div>

  <!-- LOGIN -->
  <div id="loginPage">

    <div class="login-box">

      <h2>Glitzer Login</h2>

      <input type="password" id="password" placeholder="Passwort">

      <input type="text" id="code" placeholder="Kennwort">

      <button onclick="login()">Anmelden</button>

      <div class="error" id="error"></div>

    </div>

  </div>

  <!-- STARTSEITE -->
  <div id="mainPage">

    <div class="layout">

      <!-- LINKE SEITE -->
      <div class="sidebar">

        <h1>Glitzerkuppen</h1>
        
        <a href="showplan.html">
          Showplan öffnen
        </a>
        <a href="dispatches.html">
           Dispatch Übersicht
        </a>
       
        <a href="dispatch.html">
            Dispatch erstellen
        </a>

        <a href="https://kkv-kloetze.de">
            Webseite
        </a>

        <a href="GlitzerkuppenPanel.html">
            Panel der Kuppen
        </a>   


       
      </div>

         <!-- RECHTE SEITE -->
         <div class="content">

          <img src="" alt="">
        
      </div>

    </div>    

  </div>

  <script>

    const hauptPasswort = "GlitzerKuppisPower";
        
     
                          
                          

    const kennwoerter = [
      "Glitzerkuppen",
      ];

    function login(){

      const passwort =
        document.getElementById("password").value;

      const kennwort =
        document.getElementById("code").value;

      if(
        passwort === hauptPasswort &&
        kennwoerter.includes(kennwort)
      ){

        document.getElementById("loginPage")
          .style.display = "none";

        document.getElementById("mainPage")
          .style.display = "block";

      } else {

        document.getElementById("error")
          .innerText =
          "Falsches Passwort oder Kennwort";

      }

    }
   
  
  </script>

</body>

</html>
