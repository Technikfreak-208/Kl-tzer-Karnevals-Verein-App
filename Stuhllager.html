<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stuhllager</title>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#f2f2f2;
    }

    /* LOGIN */
    #loginPage{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#1e3c72,#2a5298);
    }

    .login-box{
      background:white;
      padding:30px;
      border-radius:15px;
      width:320px;
      box-shadow:0 0 20px rgba(0,0,0,0.3);
    }

    .login-box h2{
      text-align:center;
    }

    .login-box input{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:8px;
      border:1px solid #ccc;
      box-sizing:border-box;
    }

    .login-box button{
      width:100%;
      padding:12px;
      margin-top:15px;
      border:none;
      border-radius:8px;
      background:#2a5298;
      color:white;
      cursor:pointer;
      font-size:16px;
    }

    .error{
      color:red;
      text-align:center;
      margin-top:10px;
    }

    /* STARTSEITE */
    #mainPage{
      display:none;
      height:100vh;
    }

    .layout{
      display:flex;
      height:100%;
    }

    .sidebar{
      width:250px;
      background:#1e3c72;
      color:white;
      padding:20px;
    }

    .sidebar h1{
      margin-top:0;
    }

    .sidebar a{
      display:inline-block;
      margin-top:20px;
      color:white;
      text-decoration:none;
      background:#2a5298;
      padding:10px 15px;
      border-radius:8px;
    }

    .content{
      flex:1;
      position:relative;
      overflow:hidden;
    }

    .content img{
  width:700px;
  height:auto;
  display:block;
  margin:40px auto;
  border-radius:15px;
}

    .map-button{
      position:absolute;
      padding:10px 15px;
      background:red;
      color:white;
      border:none;
      border-radius:8px;
      cursor:pointer;
    }

  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="loginPage">

    <div class="login-box">

      <h2>Login</h2>

      <input type="password" id="password" placeholder="Passwort">

      <input type="text" id="code" placeholder="Kennwort">

      <button onclick="login()">Anmelden</button>

      <div class="error" id="error"></div>

    </div>

  </div>

  <!-- STARTSEITE -->
  <div id="mainPage">

    <div class="layout">

      <!-- LINKE SEITE -->
      <div class="sidebar">

        <h1>Raumplan Saal Erdgeschoss</h1>

        <a href="1. Etage.html">
            1. Etage
        </a>
        
        <a href="showplan.html">
          Showplan öffnen
        </a>
       
        <a href="https://kkv-kloetze.de">
            Webseite
        </a>


       
      </div>

      <!-- RECHTE SEITE -->
      <div class="content">

        <img src="saalbild.jpg" alt="Saalbild">

        <!-- BUTTONS -->
         <a href="Rote,Grüne Funken.html">
        <button class="map-button"
                style="top:70%; left:18%;">
          Rote/Grüne Funken
        </button>
         </a>
         <a href="Bühne.html">
        <button class="map-button"
                style="top:25%; left:45%;">
          Bühne
        </button>
          </a>
          <a href="Eingang.html">
        <button class="map-button"
                style="top:90%; left:72%;">
          Eingang
        </button>
         </a>
         <a href="Stuhllager.html">
        <button class="map-button"
                style="top: 17%; left:20%;">
          Stuhllager
        </button>
        </a>
        <a href="Gaststätte.html">
        <button class="map-button"
                style="top: 92%; left: 45%;">
          Gaststätte
        </button>
        </a>
        <a href="Jugendgarde.html">
        <button class="map-button"
                style="top: 92%; left: 20%;">
          Jugendgarde
        </button>
        </a>
        <a href="Minis,Miniminis.html">
        <button class="map-button"
                style="top: 92%; left: 35%;">
          Minis/Miniminis
        </button>
        </a>
      </div>

    </div>    

  </div>

  <script>

    const hauptPasswort = "KKVlife";
                          

    const kennwoerter = [
      "Prinzengarde",
      "Funken",
      "Landsknechte",
      "Jugendgarde",
      "Admin",
      "Glitzerkuppen",
      "Djay",
      "Werker",
      "Frauentanzzgruppe",
      "Prinzenpaar",
      "Kinderprinzenpaar",
    ];

    function login(){

      const passwort =
        document.getElementById("password").value;

      const kennwort =
        document.getElementById("code").value;

      if(
        passwort === hauptPasswort &&
        kennwoerter.includes(kennwort)
      ){

        document.getElementById("loginPage")
          .style.display = "none";

        document.getElementById("mainPage")
          .style.display = "block";

      } else {

        document.getElementById("error")
          .innerText =
          "Falsches Passwort oder Kennwort";

      }

    }
    

  </script>

</body>
</html>
