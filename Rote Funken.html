<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rote Funken</title>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#f2f2f2;
    }

    /* LOGIN */
    #loginPage{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#ffffff,#9e1717);
    }

    .login-box{
      background:#9e1717;
      padding:30px;
      border-radius:15px;
      width:320px;
      box-shadow:0 0 20px rgba(0,0,0,0.3);
    }

    .login-box h2{
      text-align:center;
    }

    .login-box input{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:8px;
      border:1px solid #ccc;
      box-sizing:border-box;
    }

    .login-box button{
      width:100%;
      padding:12px;
      margin-top:15px;
      border:none;
      border-radius:8px;
      background:#ffffff;
      color:#9e1717;
      cursor:pointer;
      font-size:16px;
    }

    .error{
      color:red;
      text-align:center;
      margin-top:10px;
    }

    /* STARTSEITE */
    #mainPage{
      display:none;
      height:100vh;
    }

    .layout{
      display:flex;
      height:100%;
    }

    .sidebar{
      width:250px;
      background:#9e1717;
      color:white;
      padding:20px;
    }

    .sidebar h1{
      margin-top:0;
    }

    .sidebar a{
      display:inline-block;
      margin-top:20px;
      color:#9e1717;
      text-decoration:none;
      background:#ffffff;
      padding:10px 15px;
      border-radius:8px;
    }

    .content{
      flex:1;
      position:relative;
      overflow:hidden;
    }

    .content img{
  width:700px;
  height:auto;
  display:block;
  margin:40px auto;
  border-radius:15px;
}

    .map-button{
      position:absolute;
      padding:10px 15px;
      background:#9e1717;
      color:#ffffff;
      border:none;
      border-radius:8px;
      cursor:pointer;
    }
  </style>
<body>
  <!-- LOGIN -->
  <div id="loginPage">

    <div class="login-box">

      <h2>Login Rote Funken</h2>

      <input type="password" id="password" placeholder="Passwort">

      <input type="text" id="code" placeholder="Kennwort">

      <button onclick="login()">Anmelden</button>

      <div class="error" id="error"></div>

    </div>

  </div>

  <!-- STARTSEITE -->
  <div id="mainPage">

    <div class="layout">

      <!-- LINKE SEITE -->
      <div class="sidebar">

        <h1>Rote Funken</h1>
        </a>
        
        <a href="showplan.html">
          Showplan öffnen
        </a>
        <a href="https://kkv-kloetze.de/rote-funken.html">
            Rote Funken
        </a>
       <a href="dispatch.html" class="dispatch-btn">
            Dispatch öffnen
        </a>
      </div>

      <!-- RECHTE SEITE -->
      <div class="content">

        <img src="" alt="">

       
      </div>

    </div>    

  </div>

  <script>

    const hauptPasswort = "FunkenLife";
                          

    const kennwoerter = [
      "Admin",
      "Rote Funken",
    ];

    function login(){
      
      const passwort =
        document.getElementById("password").value;

      const kennwort =
        document.getElementById("code").value;

      if(
        passwort === hauptPasswort &&
        kennwoerter.includes(kennwort)
      ){

        document.getElementById("loginPage")
          .style.display = "none";

        document.getElementById("mainPage")
          .style.display = "block";

      } else {

        document.getElementById("error")
          .innerText =
          "Falsches Passwort oder Kennwort";

      }
    }
    
  </script>


</body>
</html>
